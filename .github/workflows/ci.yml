name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check src tests
      - run: pytest
      - run: rotation-patterns make-manifests --config configs/smoke.yaml --shard-size 50
      - run: rotation-patterns smoke --config configs/smoke.yaml
      - run: rotation-patterns figures --config configs/smoke.yaml --only figure3

      - name: Record the current analysis, not a claimed paper reproduction
        run: python -m rotation_patterns.analysis_receipt --output outputs/ci-analysis
